<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abrindo exemplo no JSFiddle</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#faf8f9;color:#2f292d;display:grid;place-items:center;min-height:100vh}
main{max-width:680px;margin:24px;padding:28px;background:#fff;border:1px solid #ddd;border-radius:16px;box-shadow:0 10px 30px #0001;text-align:center}
h1{color:#5b214f} code{background:#f2eef1;padding:2px 6px;border-radius:5px}
a{display:inline-block;background:#5b214f;color:#fff;text-decoration:none;border-radius:10px;padding:12px 18px;font-weight:700}
.err{color:#9b1c1c}
</style>
</head>
<body>
<main>
<h1>MiniLoja → JSFiddle</h1>
<p id="msg">Preparando o exemplo…</p>
<p><a id="go" href="#" hidden>Abrir no JSFiddle</a></p>
</main>
<script>
const allowed=new Set([
"00_base","01_console","02_query","03_texto","04_preco","05_if",
"06_funcao","07_evento","08_class","09_toggle","10_counter"
]);
const v=new URLSearchParams(location.search).get("versao") || "00_base";
const msg=document.getElementById("msg");
const go=document.getElementById("go");
if(!allowed.has(v)){
  msg.className="err";
  msg.textContent="Versão inválida: "+v;
}else{
  const tree="pedroivoalexandre/poo-java-exemplos/tree/main/web/desenvolvimento-web/tema5/exemplos/"+v;
  const url="https://jsfiddle.net/gh/get/library/pure/"+tree+"/";
  msg.innerHTML="Abrindo <code>"+v+"</code> diretamente do GitHub no JSFiddle…";
  go.href=url;
  go.hidden=false;
  location.replace(url);
}
</script>
</body>
</html>
